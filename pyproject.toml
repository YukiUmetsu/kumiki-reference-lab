[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kumiki-reference-lab"
version = "0.1.0"
description = "Local-first, evidence-backed cinematic reference analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
motion = ["numpy>=1.26"]
dense = ["numpy>=1.26", "opencv-python-headless>=4.10,<6"]

[project.scripts]
kumiki-ref = "kumiki_reference_lab.cli.app:main"
kumiki-watch = "kumiki_reference_lab.pipeline.online_study:main"
kumiki-frames = "kumiki_reference_lab.pipeline.agent_frame_review:main"
kumiki-insights = "kumiki_reference_lab.pipeline.cinematic_insights:main"
kumiki-catalog = "kumiki_reference_lab.pipeline.cinematic_catalog:main"
kumiki-sequence-benchmark = "kumiki_reference_lab.pipeline.sequence_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
