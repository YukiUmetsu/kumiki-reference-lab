name: One-shot refresh of source-hashed movie-promotion derivatives

on:
  pull_request:
    paths:
      - .github/workflows/measure-disney-trailer-once.yml

permissions:
  contents: write

jobs:
  refresh-derived-evidence:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/ephemeral-elemental-trailer-measurement'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Recompute from committed numerical evidence only
        env:
          PYTHONPATH: .:src
        run: |
          set -euo pipefail
          python scripts/audit_movie_promo_evidence.py
          python scripts/summarize_movie_promo_evidence.py --verify
          python scripts/derive_movie_promo_timed_events.py
          python scripts/derive_movie_promo_motion_proxies.py
          python scripts/derive_movie_promo_timed_events.py --verify
          python scripts/derive_movie_promo_motion_proxies.py --verify
          python -m unittest tests.test_movie_promo_evidence_audit tests.test_movie_promo_comparison tests.test_movie_promo_timed_events -q
          git diff --check
      - name: Commit only two refreshed numeric derivatives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            research/analysis/movie-promotions/derived/timed-events.v1.json \
            research/analysis/movie-promotions/derived/image-motion-proxies.v1.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'data: refresh derived cut/audio and image-motion comparisons for 14th film'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
