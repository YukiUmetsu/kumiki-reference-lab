name: One-shot Blender Agent 327 feature-teaser measurement

on:
  pull_request:
    paths:
      - .github/workflows/measure-blender-agent327-once.yml

permissions:
  contents: write

jobs:
  measure-blender-agent327:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/agent327-source-pts-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Measure one publicly available publisher edition
        env:
          PYTHONPATH: .:src
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends ffmpeg
          python -m pip install -q -e '.[motion]'
          python -m scripts.research_movie_promo_overgrown --target agent327
          python -m scripts.audit_movie_promo_evidence
          python -m scripts.rebuild_movie_promo_derived --verify
          python -m unittest tests.test_movie_promo_evidence tests.test_movie_promo_derivation_pipeline tests.test_movie_promo_timed_events tests.test_movie_promo_motion_proxies -q
          git diff --check
      - name: Commit only measured numeric evidence after temporary media deletion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/analysis/movie-promotions/index.json research/analysis/movie-promotions/agent-327-barbershop-teaser.json research/analysis/movie-promotions/derived/comparison.v1.json research/analysis/movie-promotions/derived/timed-events.v1.json research/analysis/movie-promotions/derived/image-motion-proxies.v1.json
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          if git diff --cached --name-only | grep -E '\.(mp4|m4v|wav|mp3|aac|jpg|jpeg|png|webm|mkv)$'; then
            echo 'Refusing to stage audiovisual media' >&2; exit 1
          fi
          git diff --cached --check
          git commit -m 'data: source-hashed Agent 327 publisher teaser measurements'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
