name: Python foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax and unit tests (no ML dependencies)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v

  video-ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check installed FFmpeg and FFprobe
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
      - name: Install optional numeric analysis dependencies
        run: python -m pip install -e '.[motion]'
      - name: Synthetic reference analysis through gallery
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_technique_end_to_end -v
