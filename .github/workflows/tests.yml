name: Python foundation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile and run selected fast unit checks
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src
          python -m unittest tests.test_cli tests.test_timebase tests.test_schema tests.test_catalog tests.test_sparse_tracklets tests.test_ollama_character_perception tests.test_character_vision_review tests.test_local_character_interactions tests.test_interaction_review tests.test_ollama_subject_detection tests.test_local_character_study -q
