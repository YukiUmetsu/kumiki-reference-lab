name: Python foundation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quick-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile and run selected fast unit checks
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src
          python -m unittest tests.test_movie_promo_derivation_pipeline -q
          python scripts/rebuild_movie_promo_derived.py --verify
          python -m unittest tests.test_movie_promo_timed_events -q
          python -m unittest tests.test_movie_promo_motion_proxies -q
          python scripts/derive_movie_promo_motion_proxies.py --verify
          python scripts/derive_movie_promo_timed_events.py --verify
          python -m unittest tests.test_movie_promo_study_queue -q
          python -m unittest tests.test_cli tests.test_timebase tests.test_schema tests.test_catalog tests.test_sparse_tracklets tests.test_ollama_character_perception tests.test_character_vision_review tests.test_local_character_interactions tests.test_interaction_review tests.test_ollama_subject_detection tests.test_local_character_study tests.test_subject_detection_benchmark tests.test_real_ffmpeg_character_study tests.test_character_study_batch tests.test_source_pts_seek tests.test_whatships_full_coverage tests.test_whatships_detail_enrich tests.test_whatships_media_bindings tests.test_whatships_local_worker tests.test_real_whatships_local_worker tests.test_source_visual_probe tests.test_whatships_visual_backfill tests.test_whatships_analysis_store tests.test_whatships_git_analysis_sync tests.test_whatships_numeric_frame_export tests.test_whatships_repository_explorer tests.test_whatships_direct_measure tests.test_whatships_direct_measure_batch tests.test_whatships_incremental_windows tests.test_whatships_ephemeral_acquire tests.test_whatships_audio_measure tests.test_source_visual_translation -q
