name: Python foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax and unit tests (no ML dependencies)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v

  video-ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
      - name: Install optional numeric analysis dependencies
        run: python -m pip install -e '.[motion]'
      - name: Synthetic reference and complete study integrations
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_technique_end_to_end tests.test_reference_study tests.test_review_notes tests.test_shot_gallery tests.test_audio_timeline -v
